
samples: tests/test_liqbio_sample.json

reference: autoseq-genome/autoseq-genome.json

libdir: tests/libraries

outdir: tests/

params:
    scratch: /tmp
    bwa:
        threads: 8
    samblaster:
        rm_dup: " --removeDups "
        threads: 8
    fastqc:
        threads: 1
    gatk3:
        threads: 8
        realigner_target:
            java_options: "-Xmx4G -XX:ParallelGCThreads=4"
            extra: " -allowPotentiallyMisencodedQuals --maxIntervalSize 20000 "
            threads: 4
        indel_realigner:
            java_options: "-Xmx8G -XX:ParallelGCThreads=4"
            extra: " -allowPotentiallyMisencodedQuals --maxReadsForRealignment 5000000 --maxReadsInMemory 1000000 "
            threads: 4
    picard:
        markdup:
            rmdups: "true"
            java_options: " -Xmx5g -XX:ParallelGCThreads=8 "
            extra: " "
            threads: 8
        merge_bam:
            java_options: " -Xmx10g "
        collectinsertsize:
            java_options: " -XX:ParallelGCThreads=8 "
            threads: 8
        collectoxog:
            java_options: " -XX:ParallelGCThreads=8  -Xmx2g"
            threads: 8
        collecthsmetrics:
            java_options: " -XX:ParallelGCThreads=8 "
            threads: 8
    fgbio:
        fastqtobam:
            java_options: " -Xmx10g -XX:+AggressiveOpts -XX:ParallelGCThreads=8 "
            threads: 8
        groupreadsbyumi:
            java_options: " -Xmx10g -XX:+AggressiveOpts -XX:ParallelGCThreads=8 "
            threads: 8
        callduplexconsensus:
            java_options: " -Xmx10g -XX:+AggressiveOpts -XX:ParallelGCThreads=8 "
            extra: " --min-reads 1 1 0 --min-input-base-quality 30 "
            threads: 8
        filterconsensus:
            java_options: " -Xmx10g -XX:+AggressiveOpts -XX:ParallelGCThreads=8 "
            error_rate: " --max-read-error-rate 1 --max-base-error-rate 0 "
            base_quality: " --min-base-quality 30 "
            extra: " --min-reads 1 1 0 --reverse-per-base-tags true --require-single-strand-agreement true  "
            threads: 
        clipbam:
            java_options: " -Xmx10g -XX:+AggressiveOpts -XX:ParallelGCThreads=8 "
            extra: 
            threads: 8
    create_popvcf:
        threads: 1
    contest_cancer:
        min_genotype_ratio: 0.95
        threads: 1
    contam_caveat:
        threads: 1
    cnvkit:
        threads: 8
    cnvkit-fix:
        threads: 8
    cnstoseg:
        threads: 1
    cnvkit_tracks:
        threads: 1
    gatk4:
        threads: 8
        haplotypecaller:
            java_options: " -Xmx10g "
        mutect2:
            java_options: " -Xmx10g "
    strelka:
        threads: 8
    vardict:
        threads: 8
        min_alt_frac: 0.01
        min_num_reads: null
    varscan:
        threads: 8
        java_options: " -Xmx10g "
        extra: " --min-coverage 3 --min-var-freq 0.02 --p-value 0.10 --somatic-p-value 0.05 --strand-filter 0 "
    somaticseq:
        threads: 8
    svcaller:
        threads: 1
    svaba:
        threads: 8
    lumpy:
        threads: 8
    gridss:
        threads: 8
    purecn:
        threads: 1
        maxnonclonal: " --maxnonclonal 0.2 "
        minaf: " --minaf 0.01 "
    vcfaddsample:
        threads: 1
    liqbiocna:
        threads: 1
    vep:
        threads: 8
    msisensor:
        threads: 8
    multiqc:
        threads: 1