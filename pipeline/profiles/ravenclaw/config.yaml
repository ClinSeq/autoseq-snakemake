# Snakemake 9 workflow profile — SLURM (base / non-Anchorage HPCs).
# Resolved by `autoseq launch --profile slurm`. Replaces the legacy
# cluster_config.json + slurm_submit.py pair.
#
# Resource units:
#   runtime: minutes  (was HH:MM:SS in cluster_config.json)
#   mem_mb : MB       (was `mem` string)

executor: slurm
jobs: 999
local-cores: 1
max-status-checks-per-second: 1
max-jobs-per-second: 1
#restart-times: 2
latency-wait: 120
software-deployment-method:
  - apptainer


default-resources:
  slurm_partition: core
  runtime: 6000      # 100h — matches the previous __default__ time
  mem_mb: 8000

set-resources:
  bwa_umialignment:
    runtime: 6000    # 100:00:00
    mem_mb: 32000
  bwa_umialignment_2:
    runtime: 6000    # 100:00:00
    mem_mb: 32000
